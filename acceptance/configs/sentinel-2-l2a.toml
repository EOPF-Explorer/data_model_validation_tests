# Sentinel-2 L2A. DRAFT: the layout and URL forms are from the 29 Sep /rstaging contract
# check and the 30 Sep EODC findings. Confirm the reference item and the zooms on the first run.
collections = ["sentinel-2-l2a", "sentinel-2-l2a-staging", "sentinel-2-l2a-new"]

open_groups = ["measurements/reflectance"]         # the `reflectance` asset href
multiscales_groups = ["measurements/reflectance"]  # r10m, r20m, r60m, r120m, r360m, r720m
min_levels = 2
sample_variables = ["b04", "b03", "b02"]
dtype_allow = ["uint16", "float32"]
dtype_check_pattern = "^b(0[1-9]|1[0-2]|8a)$"   # b01–b12 and b8a
min_valid = 0.25
min_distinct = 5   # the bar 16 had at 0,0.3: 5 PNG levels at 0,1 span 0.0196 of reflectance, 16 at 0,0.3 span 0.0188. At 16 a healthy ocean scene fails (T27SVB, 2 Nov)

stac = "https://api.explorer.eopf.copernicus.eu/stac"
flip = { from = "/raster/", to = "/rstaging/" }    # RG05: does each item link also work on 0.12?
asset_group = { reflectance = "measurements/reflectance" }   # RG08: each asset must point exactly here

# `reflectance` is typed `…; profile=multiscales` (register_v1.py:844), so eodash draws it
# client-side with ol/source/GeoZarr. Versions from the lockfiles, 6 Oct 2026.
[consumers.openlayers]
sentinel-explorer = "10.10.0"   # landing-page: @eox/map 2.8.0 → nested ol 10.10.0
ol-docs = "10.9.0"              # landing-page /software-services/ol pages
workshop = "10.9.0"             # foss4g-eu-26-workshop, eodash 5.7.1
upstream = "10.11.0"            # first release with the largest-divisor tile size

[render]
variables = ["b04", "b03", "b02"]
rescale = ["0,1", "0,1", "0,1"]   # what the items link (data-pipeline scripts/register_v1.py); under 0,0.3 a cloud or snow scene renders as one colour (T25WFP, 2 Nov)
# TI10: the Explorer's true colour for this collection (landing-page sentinel-explorer-config.js). 10 PNG levels at 0,0.5 span the same 0.0196.
# Only on `raster`, the host the Explorer reads: on both endpoints the registered plan is refused at 307 of 300 requests.
second_stretch = { name = "the Explorer's true colour", rescale = "0,0.5", min_distinct = 10, endpoint = "raster" }
"0.12" = { route = "item", asset = "reflectance" }
"0.11" = { group = "/measurements/reflectance" }

[endpoints]
# `api` drives the URL syntax; `expect_version` is what /api reports. Both run titiler-eopf
# v0.12.4 (d7f86e8): /rstaging read on 3 Nov; /raster from the flip's image pin, not yet read.
rstaging = { base = "https://api.explorer.eopf.copernicus.eu/rstaging", api = "0.12", expect_version = "0.12.4" }
raster = { base = "https://api.explorer.eopf.copernicus.eu/raster", api = "0.12", expect_version = "0.12.4" }

# Verified on /rstaging for S2A_MSIL2A_20260928T140901_N0513_R053_T26WNE_20260928T203014 (29 Sep).
[[contract]]
api = "0.12"
name = "item route, assets=reflectance|bands=…"
path = "WebMercatorQuad/tilejson.json"
params = [["assets", "reflectance|bands=b04,b03,b02"], ["rescale", "0,0.3"]]
expect = 200
ref = "URL contract, 29 Sep"

[[contract]]
api = "0.12"
name = "asset route, variables="
path = "assets/reflectance/WebMercatorQuad/tilejson.json"
params = [["variables", "b04"], ["rescale", "0,0.3"]]
expect = 200
ref = "URL contract, 29 Sep"

[[contract]]
api = "0.12"
name = "asset route, bands="
path = "assets/reflectance/WebMercatorQuad/tilejson.json"
params = [["bands", "b04"]]
expect = 500
ref = "titiler-eopf#178"

[[contract]]
api = "0.12"
name = "item route, 0.11 variables=/group:var syntax"
path = "WebMercatorQuad/tilejson.json"
params = [["variables", "/measurements/reflectance:b04"]]
expect = 422
ref = "URL contract, 29 Sep"

[[contract]]
api = "0.12"
name = "asset route, positional b1/b2 expression"
path = "assets/reflectance/WebMercatorQuad/tilejson.json"
params = [["variables", "b08"], ["variables", "b04"], ["expression", "(b1-b2)/(b1+b2)"]]
expect = 400
ref = "URL contract, 29 Sep: positional expressions only work on the item route"
