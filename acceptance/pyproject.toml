[project]
name = "eopf-accept"
version = "0.1.0"
description = "Acceptance checks for freshly built EOPF GeoZarr stores, for each consumer (store, titiler /rstaging and /raster)"
requires-python = ">=3.12,<3.14"  # titiler-eopf (the reader extra) caps at <3.14
# zarr, obstore, morecantile and rasterio are pinned to the /rstaging image (titiler-eopf
# v0.12.2 uv.lock), so the store checks read stores with the same code. Move the pins when the image moves.
dependencies = [
    "geozarr-toolkit==0.1.2",
    "httpx[http2]>=0.27",
    "morecantile==7.0.3",  # with rasterio: the TI02 zoom oracle uses titiler's own zoom arithmetic
    "numpy>=1.26",
    "obstore==0.11.1",
    "pillow>=10",
    "pydantic>=2.12",  # ST12 catches its ValidationError (geozarr-toolkit's models)
    "rasterio==1.5.0",
    "zarr[cast-value-rs]==3.2.0",
]

[project.optional-dependencies]
# The local-reader check (TR01) runs titiler-eopf's own GeoZarrReader: the code /rstaging runs.
# Pinned to v0.12.2 (73b01a5), the release /rstaging runs. It imports redis at load even with the cache off.
reader = ["titiler-eopf @ git+https://github.com/EOPF-Explorer/titiler-eopf@73b01a5a53896958da7bd70a9565cb0358a2dc2a", "redis", "xarray==2026.4.0"]

[project.scripts]
eopf-accept = "eopf_accept.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = []  # its own root: the repo-root pyproject (the GDAL suite) is not a uv project
