[project]
name = "eopf-accept"
version = "0.1.0"
description = "Acceptance checks for freshly built EOPF GeoZarr stores, for each consumer (store, titiler /rstaging and /raster)"
requires-python = ">=3.12,<3.14"  # titiler-eopf (the reader extra) caps at <3.14
# The read path is exact for any installer; uv also holds every other package at the /rstaging
# image's version ([tool.uv] constraint-dependencies), and `uv lock` fails if the two disagree.
dependencies = [
    "geozarr-toolkit==0.1.2",
    "httpx[http2]>=0.27",
    "morecantile==7.0.3",  # with rasterio: the TI02 zoom oracle uses titiler's own zoom arithmetic
    "numpy>=1.26",
    "obstore==0.12.0",
    "pillow>=10",
    "pydantic>=2.12",  # ST12 catches its ValidationError (geozarr-toolkit's models)
    "rasterio==1.5.0",
    "zarr[cast-value-rs]==3.2.0",
]

[project.optional-dependencies]
# The local-reader check (TR01) runs titiler-eopf's own GeoZarrReader at v0.12.4 (d7f86e8), the
# release /rstaging runs. It imports redis at load even with the cache off.
reader = ["titiler-eopf @ git+https://github.com/EOPF-Explorer/titiler-eopf@d7f86e88222d2fe3c1f09292ae105616dd057819", "redis", "xarray==2026.4.0"]

[project.scripts]
eopf-accept = "eopf_accept.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "uvicorn>=0.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Every package the suite shares with the /rstaging image resolves to the image's version, so the
# store checks, the zoom oracle, TR01 and the real-app tests run the code /rstaging runs. This is the
# uv.lock of titiler-eopf d7f86e88222d2fe3c1f09292ae105616dd057819 (the reader pin), which the image
# installs with `uv sync --locked` on Python 3.12 (.python-version). When the image moves, regenerate it
# in a titiler-eopf checkout at the new commit:
#   uv export --frozen --no-hashes --no-emit-project --no-dev --extra server --extra cache --extra openeo --no-header --no-annotate
constraint-dependencies = [
    "affine==2.4.0",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
