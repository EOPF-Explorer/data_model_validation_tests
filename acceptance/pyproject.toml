[project]
name = "eopf-accept"
version = "0.1.0"
description = "Acceptance checks for freshly built EOPF GeoZarr stores, for each consumer (store, titiler /rstaging and /raster)"
requires-python = ">=3.12,<3.14"  # titiler-eopf (the reader extra) caps at <3.14
# zarr and obstore are pinned to the /rstaging image (titiler-eopf sha-5fbea81 uv.lock), so
# the store checks read stores with the same code. Move the pins when the image moves.
dependencies = [
    "httpx[http2]>=0.27",
    "numpy>=1.26",
    "obstore==0.11.1",
    "pillow>=10",
    "zarr[cast-value-rs]==3.2.0",
]

[project.optional-dependencies]
# The local-reader check (TR01) runs titiler-eopf's own GeoZarrReader: the code /rstaging runs.
# Pinned to 5fbea81, the exact commit /rstaging runs (v0.12.0 differs only in version strings,
# so this reports 0.11.0 like /rstaging). It imports redis at load even with the cache off.
reader = ["titiler-eopf @ git+https://github.com/EOPF-Explorer/titiler-eopf@5fbea81ff7b6cfd556c46be5bf1bf6671fb5ac58", "redis", "xarray==2026.4.0"]

[project.scripts]
eopf-accept = "eopf_accept.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = []  # its own root: the repo-root pyproject (the GDAL suite) is not a uv project
