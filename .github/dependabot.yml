version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/acceptance"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    # Security updates only: pyproject.toml holds these packages at the titiler-eopf
    # image's versions, so a version update would only move them off it.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
